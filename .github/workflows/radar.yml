name: Housing Radar

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar.yml'
      - 'radar/**'
      - 'web/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'sources.yaml'
      - 'config.yaml'
      - 'programs.yaml'
      - 'data/deadlines.yaml'

permissions: {}
concurrency:
  group: housing-radar-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 24
    permissions:
      contents: write
      issues: write
      pages: read
    outputs:
      pages_ready: ${{ steps.pages.outputs.ready }}
      alert_status: ${{ steps.alerts.outcome }}
      threshold_failed: ${{ steps.health.outputs.threshold_failed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Collect monitored sources, retaining the last good snapshots
        run: python -c 'from radar.collect import collect; collect()'
      - name: Render the static site and feed
        run: python -m radar.render
      - name: Record health
        id: health
        run: |
          python -c 'import json; from radar.health import threshold_failed; print("threshold_failed=" + str(threshold_failed(json.load(open("data/state.json"))["health_groups"])).lower())' >> "$GITHUB_OUTPUT"
          jq -r '"Source health: \(.total - .failed)/\(.total) healthy."' data/state.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save source history and daily activity to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ sources.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Record housing radar collection $(TZ=America/Los_Angeles date +%F)"
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Check the repository's Pages source
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2> "$RUNNER_TEMP/pages-check"); then
            if [[ "$mode" == workflow ]]; then ready=true; else ready=false; fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-check"; then
            ready=false
          else
            cat "$RUNNER_TEMP/pages-check" >&2
            exit 1
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != true ]]; then
            echo 'Publishing awaits Settings > Pages > Build and deployment > Source > GitHub Actions.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
      - name: Deliver daily issue when changes are found
        id: alerts
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m radar.alerts

  health:
    needs: collect
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check state and local source failure rates
        env:
          THRESHOLD_FAILED: ${{ needs.collect.outputs.threshold_failed }}
        run: test "$THRESHOLD_FAILED" = false

      - name: Check issue delivery
        if: needs.collect.outputs.alert_status == 'failure'
        run: exit 1

  deploy:
    if: needs.collect.outputs.pages_ready == 'true'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
